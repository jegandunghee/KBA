<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11bb6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d8d4b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 투명 배경 -->
  <!-- 심볼 디자인 (코드 브라켓) -->
